<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solventa · Confirmar acción — F5.1</title>
<link rel="stylesheet" href="../_ds/solventa-design-system-0139be36-ed30-411d-9b84-052f881b66df/tokens/fonts.css">
<link rel="stylesheet" href="../_ds/solventa-design-system-0139be36-ed30-411d-9b84-052f881b66df/tokens/colors.css">
<link rel="stylesheet" href="../_ds/solventa-design-system-0139be36-ed30-411d-9b84-052f881b66df/tokens/typography.css">
<link rel="stylesheet" href="../_ds/solventa-design-system-0139be36-ed30-411d-9b84-052f881b66df/tokens/spacing.css">
<link rel="stylesheet" href="../_ds/solventa-design-system-0139be36-ed30-411d-9b84-052f881b66df/tokens/borders.css">
<link rel="stylesheet" href="../_ds/solventa-design-system-0139be36-ed30-411d-9b84-052f881b66df/tokens/motion.css">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>
<div class="console">

  <aside class="console-sidebar">
    <a href="../index.html" class="brand" style="text-decoration:none;"><img src="../assets/logo-mark-inverse.svg" alt="" width="24" height="24"><span>Solventa</span></a>
    <nav class="console-nav">
      <a href="../e2-socios/registrar-socio.html">Socios</a>
      <a href="../e2-socios/nuevo-prospecto.html">Prospectos</a>
      <a href="../e2-socios/seguimiento-ventas.html">Seguimiento</a>
      <a href="polizas.html" class="current">Pólizas</a>
    </nav>
    <div class="foot">operaciones · vigilado por la sfc</div>
  </aside>

  <div class="console-main">
    <div class="console-topbar">
      <div><div class="crumb"><a href="polizas.html">pólizas</a> / <a href="detalle-poliza.html">#SLV-2026-08341</a> / confirmar</div><h1 id="titulo">Confirmar acción</h1></div>
    </div>

    <div class="console-content" style="max-width:640px;">
      <div class="card">
        <div class="card-body">
          <p id="copia" style="color:var(--text-muted); font-size:var(--size-body-sm);"></p>

          <div id="camposModificar" style="display:none; flex-direction:column; gap:var(--space-9); margin-top:var(--space-9);">
            <div class="field"><label>Nuevo límite de cobertura</label><input class="input" value="$60.000.000"></div>
            <div class="field"><label>Motivo del cambio</label><textarea class="input" style="height:70px; padding-top:var(--space-4);" placeholder="Cliente solicita ampliar cobertura de equipaje."></textarea></div>
          </div>

          <div id="camposCancelar" style="display:none; flex-direction:column; gap:var(--space-9); margin-top:var(--space-9);">
            <div class="field"><label>Motivo de cancelación</label>
              <select class="input"><option>Solicitud del cliente</option><option>Falta de pago</option><option>Fraude detectado</option></select>
            </div>
          </div>

          <div class="callout" style="margin-top:var(--space-10);">Este cambio queda registrado en la trazabilidad de la póliza y se incluye en los reportes regulatorios y de reaseguro cuando aplica.</div>

          <div style="display:flex; gap:var(--space-7); margin-top:var(--space-12);">
            <a href="detalle-poliza.html" class="btn btn-secondary" style="flex:1;">Cancelar</a>
            <a href="detalle-poliza.html" id="confirmar" class="btn btn-primary" style="flex:1;">Confirmar</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  var accion = new URLSearchParams(location.search).get('accion') || 'renovar';
  var textos = {
    renovar: { titulo: 'Renovar póliza', copia: 'La póliza #SLV-2026-08341 se renovará por 30 días adicionales, con las mismas condiciones y una prima recalculada de $24.300 COP/mes.', boton: 'Renovar por 30 días' },
    modificar: { titulo: 'Modificar condiciones', copia: 'Ajusta las condiciones de la póliza #SLV-2026-08341. El cambio se aplica de inmediato y queda trazado.', boton: 'Guardar cambios' },
    cancelar: { titulo: 'Cancelar póliza', copia: 'La póliza #SLV-2026-08341 dejará de estar vigente de inmediato. Esta acción queda registrada y no se puede deshacer desde esta consola.', boton: 'Confirmar cancelación' }
  };
  var t = textos[accion] || textos.renovar;
  document.getElementById('titulo').textContent = t.titulo;
  document.getElementById('copia').textContent = t.copia;
  document.getElementById('confirmar').textContent = t.boton;
  if (accion === 'modificar') document.getElementById('camposModificar').style.display = 'flex';
  if (accion === 'cancelar') document.getElementById('camposCancelar').style.display = 'flex';
</script>
</body>
</html>
