</head>
<body>
<div class="console">

  <aside class="console-sidebar">
    <a href="../index.html" class="brand" style="text-decoration:none;"><img src="../assets/logo-mark-inverse.svg" alt="" width="24" height="24"><span>Solventa</span></a>
    <nav class="console-nav">
      <a href="registrar-socio.html">Socios</a>
      <a href="nuevo-prospecto.html" class="current">Prospectos</a>
      <a href="seguimiento-ventas.html">Seguimiento</a>
      <a href="../e5-polizas/polizas.html">Pólizas</a>
    </nav>
    <div class="foot">socio: rappi seguros · sesión asistida</div>
  </aside>

  <div class="console-main">
    <div class="console-topbar">
      <div><div class="crumb">prospectos · f2.2</div><h1>Registrar prospecto</h1></div>
      <a href="seguimiento-ventas.html" class="btn btn-secondary btn-sm">Ver seguimiento</a>
    </div>

    <div class="console-content" style="max-width:720px;">
      <div class="callout callout-accent" style="margin-bottom:var(--space-10);">Estás vendiendo como <strong>Rappi Seguros</strong>. Los datos de este cliente quedan aislados: solo tu equipo puede verlos.</div>

      <form onsubmit="location.href='cotizacion-asistida.html'; return false;">
        <div class="card">
          <div class="card-header"><div class="kicker">datos del cliente</div></div>
          <div class="card-body" style="display:flex; flex-direction:column; gap:var(--space-9);">
            <div class="grid-2">
              <div class="field"><label>Nombres</label><input class="input" placeholder="Julián" required></div>
              <div class="field"><label>Apellidos</label><input class="input" placeholder="Mesa Ortiz" required></div>
            </div>
            <div class="grid-2">
              <div class="field"><label>Documento</label><input class="input" placeholder="1 122 334 455" required></div>
              <div class="field"><label>Celular</label><input class="input" placeholder="311 000 0000" required></div>
            </div>
            <div class="field"><label>Ramo de interés</label>
              <select class="input"><option>Dispositivos móviles</option><option>Viaje</option><option>Vida</option></select>
            </div>
            <div class="checkbox-row">
              <input type="checkbox" id="consiento2" checked>
              <label for="consiento2" class="txt">El cliente autorizó, de forma verificable, compartir sus datos con Solventa a través de este canal.</label>
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:var(--space-10);">Iniciar cotización asistida</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
